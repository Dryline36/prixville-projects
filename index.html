<style>
  :root {
    --bg: #090909;
    --surface: #131313;
    --surface-2: #1a1a1a;
    --cream: #f6f0e6;
    --muted: #a8a8a8;
    --white: #fff;
    --tangerine: #ff7347;
    --live: #39ff6a;
    --soon: #3dbaff;
    --line: #232323;
    --banner: #ff7347;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); }
  body {
    font-family: "Crimson Text", Georgia, serif;
    min-height: 100%;
    background:
      radial-gradient(900px 420px at 10% -10%, rgba(255,115,71,.16), transparent 60%),
      radial-gradient(700px 380px at 110% 20%, rgba(61,186,255,.08), transparent 55%),
      var(--bg);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .ticker {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: var(--banner); color: #111; min-height: 42px; padding: 8px 16px;
    font-family: "Rokkitt", Rockwell, serif; font-weight: 700; letter-spacing: .01em;
  }
  .ticker .dot {
    width: 28px; height: 28px; border-radius: 8px; background: #111; color: var(--cream);
    display: grid; place-items: center; font-size: 14px;
  }
  .ticker .view {
    background: #111; color: var(--cream); border: 0; border-radius: 999px;
    padding: 6px 12px; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    box-shadow: 2px 2px 0 #5a2414;
  }

  header.nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px 8px; gap: 16px;
  }
  .brand {
    font-family: "Rokkitt", Rockwell, serif; font-weight: 900; font-size: 28px;
    letter-spacing: -.03em; margin: 0;
  }
  .brand span { color: var(--tangerine); }
  nav.links { display: flex; gap: 8px; flex-wrap: wrap; }
  nav.links button {
    background: transparent; border: 0; color: var(--muted);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px;
  }
  nav.links button[aria-pressed="true"] {
    color: var(--cream); box-shadow: inset 0 -2px 0 var(--tangerine);
  }

  main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 48px; }
  .lede {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    margin: 8px 0 18px;
  }
  .lede h2 {
    font-family: "Rokkitt", Rockwell, serif; font-weight: 800; font-size: clamp(40px, 6vw, 64px);
    margin: 0; letter-spacing: -.03em; line-height: .9;
  }
  .lede h2 em { font-style: normal; color: var(--tangerine); }
  .lede p { margin: 8px 0 0; color: var(--muted); font-style: italic; font-size: 18px; max-width: 420px; }
  .note {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  .stage { display: grid; grid-template-columns: 1fr; justify-items: center; }
  .stack {
    position: relative; width: min(420px, 94vw); height: 740px; margin-top: 8px;
  }
  .card {
    position: absolute; inset: 0; background: var(--surface);
    border: 2px solid var(--cream);
    border-radius: 28px 16px 30px 18px;
    box-shadow: 8px 8px 0 var(--cream);
    overflow: hidden; display: flex; flex-direction: column;
    transform-origin: center bottom; touch-action: none; user-select: none;
  }
  .card.back-2 { transform: translateY(-22px) scale(.92); opacity: .45; }
  .card.back-1 { transform: translateY(-12px) scale(.96); opacity: .75; }
  .art { height: 46%; position: relative; overflow: hidden; flex: none; }
  .art svg { width: 100%; height: 100%; display: block; }
  .chip {
    position: absolute; top: 14px; left: 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .14em; font-weight: 700;
    padding: 5px 8px; border-radius: 999px; color: #081108;
  }
  .chip.live { background: var(--live); }
  .chip.upcoming { background: var(--soon); color: #041018; }
  .body { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden; touch-action: none; }
  .body h3 {
    margin: 0; font-family: "Rokkitt", Rockwell, serif; font-weight: 800;
    font-size: 34px; letter-spacing: -.03em; line-height: .95;
  }
  .meta {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px;
    color: var(--muted); letter-spacing: .02em; line-height: 1.45;
  }
  .blurb { margin: 4px 0 0; font-size: 17px; color: var(--cream); }

  .wallet {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .03em; line-height: 1.35;
    padding: 8px 10px; border-radius: 12px; border: 2px solid #111;
    color: #111;
  }
  .wallet b { font-weight: 700; letter-spacing: .12em; }
  .wallet.green { background: #39ff6a; }
  .wallet.yellow { background: #e2c044; }
  .wallet.red { background: #ff2d2d; color: #fff; }
  .card.front.risk-green { box-shadow: 8px 8px 0 #39ff6a; }
  .card.front.risk-yellow { box-shadow: 8px 8px 0 #e2c044; }
  .card.front.risk-red { box-shadow: 8px 8px 0 #ff2d2d; }
  .socials { display: flex; flex-wrap: wrap; gap: 8px; }
  .socials a {
    color: #111; background: var(--cream); text-decoration: none;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 6px 8px; border-radius: 999px; border: 2px solid #111;
  }


  .tray {
    margin-top: 18px; background: var(--cream); color: #111;
    border-radius: 999px; display: flex; gap: 6px; padding: 8px;
    box-shadow: 4px 4px 0 #3a3a3a;
  }
  .tray button {
    width: 52px; height: 52px; border-radius: 50%; border: 2px solid #111; background: transparent;
    font-size: 18px;
  }
  .tray button.primary { background: var(--tangerine); box-shadow: 2px 2px 0 #111; }
  .tray button.save[aria-pressed="true"] { background: #111; color: var(--cream); }

  .empty {
    width: min(380px, 92vw); min-height: 280px; border: 2px dashed var(--line);
    border-radius: 24px; display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .empty button {
    margin-top: 12px; background: var(--tangerine); color: #111; border: 0;
    border-radius: 999px; padding: 10px 16px; font-family: "Rokkitt", Rockwell, serif;
    font-weight: 800; box-shadow: 3px 3px 0 #111;
  }

  .board { display: none; grid-template-columns: 1fr 1fr; gap: 28px; }
  .board.show { display: grid; }
  .stage.hide { display: none; }
  .col h4 {
    margin: 0 0 12px; font-family: "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: .16em; font-size: 12px; color: var(--muted); font-weight: 500;
  }
  .grid { display: grid; gap: 14px; }
  .tile {
    background: var(--surface); border: 2px solid var(--cream);
    border-radius: 18px 10px 20px 12px; box-shadow: 5px 5px 0 var(--cream); overflow: hidden;
  }
  .tile .art { height: 160px; }
  .tile .body { padding: 12px 14px 14px; }
  .tile h3 { font-size: 26px; }
  @media (max-width: 800px) {
    .board.show { grid-template-columns: 1fr; }
    header.nav { flex-direction: column; align-items: flex-start; }
    body { overflow-x: hidden; }
    .ticker { font-size: 15px; gap: 8px; text-align: center; }
    .ticker span:nth-child(2) { line-height: 1.1; }
    header.nav { padding: 10px 14px 0; }
    nav.links { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
    .lede { display: none; }
    main { padding: 8px 14px 28px; }
    .stack { width: 100%; height: calc(100dvh - 168px); min-height: 640px; }
    .art { height: 34%; }
    .body { padding: 18px 18px 20px; gap: 12px; }
    .body h3 { font-size: 32px; }
    .wallet, .counts, .blurb { line-height: 1.45; }
    .tray button { width: 48px; height: 48px; }
  }

  .counts {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  .burst {
    position: fixed; left: 50%; top: 40%; z-index: 80;
    pointer-events: none; line-height: 1;
    animation: burst .7s ease forwards;
  }
  .burst.dislike {
    font-family: "Rokkitt", Rockwell, serif; font-weight: 900;
    font-size: min(240px, 62vw); color: #ff2d2d;
    text-shadow: 8px 8px 0 #111;
  }
  .burst.like { font-size: min(160px, 42vw); }

  .vote-note {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: .02em; line-height: 1.4;
    color: #ffd0c6; background: #2a1210; border: 2px solid #ff2d2d;
    border-radius: 12px; padding: 8px 10px;
  }
  .unsaved {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 90; max-width: min(440px, 92vw);
    background: #111; color: var(--cream); border: 2px solid var(--tangerine);
    box-shadow: 4px 4px 0 #3a3a3a; padding: 10px 14px; border-radius: 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    line-height: 1.4;
  }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-10deg); }
    25% { opacity: 1; transform: translate(-50%, -60%) scale(1.12) rotate(6deg); }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1.35) rotate(0deg); }
  }
</style>
</head>

const saved = new Set();
const stats = {};
PROJECTS.forEach(p => { stats[p.id] = { views: 0, likes: 0, dislikes: 0 }; });
let filter = "all";

let lastViewed = null;
function short(a) { return a.slice(0, 6) + "…" + a.slice(-4); }
function fmt(n) { return n.toLocaleString("en-US"); }

let audioCtx = null;
function audio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(ctx, type, f0, f1, dur, vol) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), ctx.currentTime + dur);
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime + dur + 0.02);
}
function buzzer() {
  const ctx = audio();
  tone(ctx, "square", 180, 110, 0.55, 0.45);
  tone(ctx, "sawtooth", 90, 70, 0.55, 0.35);
}
function squish() {
  const ctx = audio();
  tone(ctx, "sine", 640, 90, 0.28, 0.55);
  tone(ctx, "triangle", 320, 60, 0.2, 0.35);
}
document.addEventListener("pointerdown", () => { audio(); }, { once: true });

function burst(kind) {
  const el = document.createElement("div");
  el.className = "burst " + kind;
  el.textContent = kind === "like" ? "💦" : "✕";
  document.body.appendChild(el);
  if (kind === "like") { squish(); if (navigator.vibrate) navigator.vibrate([40, 30, 40, 30, 140]); }
  else buzzer();
  setTimeout(() => el.remove(), 700);
}
let drag = null;

function visible() {
  return order
    .map(id => PROJECTS.find(p => p.id === id))
    .filter(p => {
      if (filter === "saved") return saved.has(p.id);
      if (filter === "all") return true;
      return p.status === filter;
    });
}

function cardHtml(p, cls) {
  const chip = p.status === "live" ? "live" : "upcoming";
  const label = p.status === "live" ? "LIVE" : "UPCOMING";
  const riskWord = p.risk === "green" ? "GREEN" : p.risk === "red" ? "RED" : "YELLOW";
  return `<article class="card ${cls} risk-${p.risk}" data-id="${p.id}">
    <div class="art">${art(p)}<span class="chip ${chip}">${label}</span></div>
    <div class="body">
      <h3>${p.name}</h3>
      <div class="meta">${p.founder} · ${p.followers} followers</div><div class="meta">${p.chain} · ${p.supply} · ${p.price}</div><div class="meta">${p.when}</div>
      <div class="wallet ${p.risk}"><b>${riskWord}</b> · ${p.wallet ? short(p.wallet) : "No payout wallet"} · ${p.walletNote}</div>
      <div class="counts">${fmt(stats[p.id].views)} views · ${fmt(stats[p.id].likes)} likes · ${fmt(stats[p.id].dislikes)} dislikes</div>
      <p class="blurb">${p.blurb}</p>
      <div class="socials">${(p.socials||[]).map(s => `<a href="${s.href}" target="_blank" rel="noopener">${s.label}</a>`).join("")}</div>
    </div>
  </article>`;
}

function render() {
  const items = visible();
  if (items[0] && items[0].id !== lastViewed) {
    stats[items[0].id].views += 1;
    lastViewed = items[0].id;
  }
  const stack = document.getElementById("stack");
  const board = document.getElementById("board");
  if (!items.length) {
    stack.innerHTML = `<div class="empty"><div><div class="note">Nothing in this pile</div><button type="button" id="reset">Start over</button></div></div>`;
    document.getElementById("reset").onclick = () => { order = PROJECTS.map(p => p.id); render(); };
  } else {
    const top = items.slice(0, 3);
    stack.innerHTML = top.map((p, i) => cardHtml(p, i === 0 ? "front" : i === 1 ? "back-1" : "back-2")).reverse().join("");
    bindDrag();
  }
  document.getElementById("save").setAttribute("aria-pressed", items[0] && saved.has(items[0].id) ? "true" : "false");

  const groups = [
    ["Upcoming", items.filter(p => p.status === "upcoming")],
    ["Live", items.filter(p => p.status === "live")]
  ];
  if (filter === "saved") {
    board.innerHTML = `<div class="col" style="grid-column:1/-1"><h4>Saved</h4><div class="grid">${items.map(tile).join("") || "<p>None saved yet.</p>"}</div></div>`;
  } else if (filter === "upcoming" || filter === "live") {
    const only = filter === "live" ? groups[1] : groups[0];
    board.innerHTML = `<div class="col" style="grid-column:1/-1"><h4>${only[0]}</h4><div class="grid">${only[1].map(tile).join("")}</div></div>`;
  } else {
    board.innerHTML = groups.map(([title, list]) => `<div class="col"><h4>${title}</h4><div class="grid">${list.map(tile).join("")}</div></div>`).join("");
  }
}

function tile(p) {
  const chip = p.status === "live" ? "live" : "upcoming";
  const label = p.status === "live" ? "LIVE" : "UPCOMING";
  return `<article class="tile"><div class="art">${art(p)}<span class="chip ${chip}">${label}</span></div><div class="body"><h3>${p.name}</h3><div class="meta">${p.supply} · ${p.price}</div></div></article>`;
}

function advance(id) {
  order = order.filter(x => x !== id).concat(id);
  lastViewed = null;
  render();
}
function voteMessage(projectId, kind) {
  return "Prixville vote\nProject: " + projectId + "\nVote: " + kind;
}
function showUnsaved() {
  const el = document.getElementById("unsaved");
  el.hidden = false;
  el.textContent = "Vote not saved. A downloaded file cannot see other wallets.";
}
function showCardError(text) {
  const front = document.querySelector(".card.front");
  if (!front) return;
  front.style.transform = "";
  let note = front.querySelector(".vote-note");
  if (!note) {
    note = document.createElement("div");
    note.className = "vote-note";
    const body = front.querySelector(".body");
    const counts = front.querySelector(".counts");
    if (counts && counts.nextSibling) body.insertBefore(note, counts.nextSibling);
    else body.appendChild(note);
  }
  note.textContent = text;
}
function countLocal(kind, id) {
  if (kind === "like") {
    stats[id].likes += 1;
    saved.add(id);
    burst("like");
  } else {
    stats[id].dislikes += 1;
    burst("dislike");
  }
  advance(id);
}
let voting = false;
async function postVote(projectId, kind) {
  if (!window.ethereum) throw new Error("Connect a wallet to vote");
  const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  const address = accounts && accounts[0];
  if (!address) throw new Error("Connect a wallet to vote");
  const message = voteMessage(projectId, kind);
  let signature;
  try {
    signature = await window.ethereum.request({ method: "personal_sign", params: [message, address] });
  } catch (e) {
    throw new Error("Signature rejected");
  }
  let res;
  try {
    res = await fetch("/api/vote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address: address, project_id: projectId, direction: kind, message: message, signature: signature })
    });
  } catch (e) {
    return { notSaved: true };
  }
  let data = {};
  try { data = await res.json(); } catch (e) { data = {}; }
  if (!res.ok) throw new Error(data.error || "Vote rejected");
  return data;
}
async function vote(kind) {
  if (voting) return;
  const items = visible();
  if (!items.length) return;
  const id = items[0].id;
  if (location.protocol === "file:") {
    countLocal(kind, id);
    showUnsaved();
    return;
  }
  voting = true;
  try {
    const result = await postVote(id, kind);
    if (result.notSaved) {
      countLocal(kind, id);
      showUnsaved();
      return;
    }
    stats[id].likes = result.likes;
    stats[id].dislikes = result.dislikes;
    if (kind === "like") {
      saved.add(id);
      burst("like");
    } else {
      burst("dislike");
    }
    advance(id);
  } catch (err) {
    showCardError(err && err.message ? err.message : "Vote rejected");
  } finally {
    voting = false;
  }
}
function pass() { vote("dislike"); }
function like() { vote("like"); }

function bindDrag() {
  const front = document.querySelector(".card.front");
  if (!front) return;
  front.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, el: front, moved: false };
    front.setPointerCapture(e.pointerId);
  });
  front.addEventListener("pointermove", (e) => {
    if (!drag || drag.el !== front) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    drag.moved = true;
    front.style.transform = `translate(${dx}px, ${dy * 0.12}px) rotate(${dx / 22}deg)`;
  });
  const end = (e) => {
    if (!drag || drag.el !== front) return;
    const dx = e.clientX - drag.x;
    const moved = drag.moved;
    drag = null;
    if (!moved || Math.abs(dx) < 70) {
      front.style.transform = "";
      return;
    }
    if (dx > 0) like();
    else pass();
  };
  front.addEventListener("pointerup", end);
  front.addEventListener("pointercancel", () => { drag = null; front.style.transform = ""; });
  front.addEventListener("click", (e) => {
    if (e.target.closest("a") && front.style.transform) e.preventDefault();
  });
}

document.getElementById("pass").onclick = pass;
document.getElementById("next").onclick = pass;
document.getElementById("save").onclick = like;
document.getElementById("info").onclick = () => {
  document.getElementById("layout").click();
};
document.querySelectorAll("[data-filter]").forEach(btn => {
  btn.onclick = () => {
    filter = btn.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    render();
  };
});
document.getElementById("layout").onclick = () => {
  const boardOn = document.getElementById("board").classList.toggle("show");
  document.getElementById("stage").classList.toggle("hide", boardOn);
  document.getElementById("layout").setAttribute("aria-pressed", boardOn ? "true" : "false");
  document.getElementById("layout").textContent = boardOn ? "Stack" : "Board";
};
document.getElementById("jumpRichards").onclick = () => {
  filter = "upcoming";
  document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === "upcoming" ? "true" : "false"));
  order = PROJECTS.map(p => p.id);
  if (document.getElementById("board").classList.contains("show")) document.getElementById("layout").click();
  render();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") pass();
  if (e.key === "ArrowRight") like();
});
async function loadCounts() {
  if (location.protocol === "file:") return;
  try {
    const res = await fetch("/api/counts");
    if (!res.ok) return;
    const data = await res.json();
    PROJECTS.forEach(p => {
      if (!data[p.id]) return;
      stats[p.id].likes = data[p.id].likes || 0;
      stats[p.id].dislikes = data[p.id].dislikes || 0;
    });
    render();
  } catch (e) {}
}
render();
loadCounts();
</script>
